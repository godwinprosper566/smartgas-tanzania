<!DOCTYPE html>
<html>
<head>
    <title>Order Received</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f7fafc; text-align: center; padding-top: 80px; }
        h1 { color: #38a169; }
        .nav { margin-bottom: 30px; }
        .nav a { color: #2b6cb0; margin: 0 12px; text-decoration: none; font-weight: bold; }
        a.btn { display: inline-block; margin-top: 20px; background-color: #ed8936; color: white; padding: 10px 24px; text-decoration: none; border-radius: 6px; margin: 8px; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/">Home</a>
        <a href="/order/">Order Gas</a>
        <a href="/track/">Track Order</a>
        {% if user.is_authenticated %}
            <a href="/orders/">All Orders</a>
            <a href="/report/">Daily Report</a>
            <a href="/dashboard/">Dashboard</a>
            <a href="/logout/">Logout ({{ user.username }})</a>
        {% else %}
            <a href="/login/">Staff Login</a>
        {% endif %}
    </div>

    <h1>Order Received Successfully!</h1>
    <p>Asante. We will contact you soon.</p>
    <p>Your Order ID is: <strong>#{{ order_id }}</strong></p>

    <a href="/" class="btn">Back to Home</a>
    <a href="/order/" class="btn">New Order</a>
    <a href="/track/" class="btn">Track Order</a>
</body>
</html>
