<!DOCTYPE html>
<html>
<head>
    <title>Edit Order - SmartGas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7fafc;
            max-width: 420px;
            margin: 40px auto;
            padding: 20px;
        }
        h1 {
            color: #1a365d;
            text-align: center;
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: #2d3748;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #cbd5e0;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }
        button {
            width: 100%;
            background: #ed8936;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        .nav {
            text-align: center;
            margin-bottom: 20px;
        }
        .nav a {
            color: #2b6cb0;
            margin: 0 10px;
            text-decoration: none;
            font-weight: bold;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            color: #718096;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/">Home</a>
        <a href="/order/">Order Gas</a>
        <a href="/track/">Track Order</a>
        {% if user.is_authenticated %}
            <a href="/dashboard/">Dashboard</a>
            <a href="/orders/">All Orders</a>
            <a href="/report/">Daily Report</a>
            <a href="/logout/">Logout ({{ user.username }})</a>
        {% else %}
            <a href="/login/">Staff Login</a>
        {% endif %}
    </div>

    <h1>Edit Order #{{ order.id }}</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Customer Name</label>
        <input type="text" name="name" value="{{ order.name }}" required>

        <label>Phone Number</label>
        <input type="text" name="phone" value="{{ order.phone }}" required>

        <label>Location</label>
        <input type="text" name="location" value="{{ order.location }}" required>

        <label>Customer Type</label>
        <select name="customer_type" required>
            <option value="Household" {% if order.customer_type == "Household" %}selected{% endif %}>Household</option>
            <option value="Vehicle" {% if order.customer_type == "Vehicle" %}selected{% endif %}>Vehicle (CNG)</option>
            <option value="Business" {% if order.customer_type == "Business" %}selected{% endif %}>Business</option>
        </select>

        <label>Cylinder Size</label>
        <select name="size_kg" required>
            <option value="6" {% if order.size_kg == 6 %}selected{% endif %}>6 kg</option>
            <option value="15" {% if order.size_kg == 15 %}selected{% endif %}>15 kg</option>
            <option value="45" {% if order.size_kg == 45 %}selected{% endif %}>45 kg</option>
        </select>

        <label>Status</label>
        <select name="status" required>
            <option value="Pending" {% if order.status == "Pending" %}selected{% endif %}>Pending</option>
            <option value="Out for Delivery" {% if order.status == "Out for Delivery" %}selected{% endif %}>Out for Delivery</option>
            <option value="Delivered" {% if order.status == "Delivered" %}selected{% endif %}>Delivered</option>
        </select>

        <label>Payment Status</label>
        <select name="payment_status" required>
            <option value="Unpaid" {% if order.payment_status == "Unpaid" %}selected{% endif %}>Unpaid</option>
            <option value="Paid" {% if order.payment_status == "Paid" %}selected{% endif %}>Paid</option>
        </select>

        <label>Notes (optional)</label>
        <input type="text" name="notes" value="{{ order.notes|default:'' }}" placeholder="Any special request...">

        <button type="submit">Update Order</button>
    </form>

    <footer>SmartGas Tanzania – Safe Gas Delivery</footer>
</body>
</html>
